<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hexo-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hexo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hexo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 交流群二维码：右下角悬浮按钮 + 弹出卡片（适配手机/电脑端） -->
  <style>
    #qr-fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #12b7f5;
      border: none;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 16px rgba(18, 183, 245, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      padding: 0;
    }
    #qr-fab:hover {
      transform: scale(1.08);
    }
    #qr-fab svg {
      width: 30px;
      height: 30px;
      fill: #fff;
      display: block;
    }
    #qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 99998;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #qr-overlay.open {
      display: flex;
    }
    #qr-card {
      background: #fff;
      border-radius: 16px;
      padding: 22px 20px 18px;
      width: min(320px, 85vw);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: qr-pop 0.22s ease;
    }
    @keyframes qr-pop {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    #qr-card h3 {
      margin: 0 0 14px;
      font-size: 17px;
      color: #222;
      font-weight: 600;
      padding-right: 20px;
    }
    #qr-card img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
    #qr-card p {
      margin: 12px 0 0;
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }
    #qr-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 22px;
      color: #aaa;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      transition: color 0.15s;
    }
    #qr-close:hover {
      color: #555;
    }
    /* 电脑端：卡片贴近按钮，浮层不拦截页面 */
    @media (min-width: 601px) {
      #qr-overlay.open {
        background: rgba(0, 0, 0, 0);
        align-items: flex-end;
        justify-content: flex-end;
        pointer-events: none;
      }
      #qr-overlay.open #qr-card {
        margin: 0 26px 92px 0;
        pointer-events: auto;
      }
      #qr-card::after {
        content: '';
        position: absolute;
        bottom: -14px;
        right: 26px;
        border: 7px solid transparent;
        border-top-color: #fff;
      }
    }
    /* 手机端：居中弹出 + 底部安全区 */
    @media (max-width: 600px) {
      #qr-fab {
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      }
      #qr-card {
        padding-bottom: 20px;
      }
    }
  </style>
  <button id="qr-fab" aria-label="加入交流群" title="加入交流群">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <path d="M824.8 613.2c-16-51.4-34.4-124.2-34.4-207.5 0-166.2-89.2-264.3-223.8-264.3-134.6 0-223.8 98.1-223.8 264.3 0 83.3-18.4 156.1-34.4 207.5-34.5 110.6-72 159.9-87.3 171.6 10.9 17.4 50.1 9.5 63.4 42.4 2.9 7.2 6.5 22 6.5 34.4 0 30.9-21.4 56-47.7 56-58.5 0-76.3-61.1-91-114.7-18.7-68-14.8-92.9-46.2-133-7-8.9-11.1-18.3-11.1-28.2 0-17.6 16.7-31.9 37.3-31.9 7.4 0 14.5 1.9 20.8 5.2-5.7-36.1-8.8-85.6-8.8-149.8 0-197.5 106.6-342.9 267-342.9 160.4 0 267 145.4 267 342.9 0 64.2-3.1 113.7-8.8 149.8 6.3-3.3 13.4-5.2 20.8-5.2 20.6 0 37.3 14.3 37.3 31.9 0 9.9-4.1 19.3-11.1 28.2-31.4 40.1-27.5 65-46.2 133-14.7 53.6-32.5 114.7-91 114.7-26.3 0-47.7-25.1-47.7-56 0-12.4 3.6-27.2 6.5-34.4 13.3-32.9 52.5-25 63.4-42.4-15.3-11.7-52.8-61-87.3-171.6z"/>
    </svg>
  </button>
  <div id="qr-overlay">
    <div id="qr-card">
      <button id="qr-close" aria-label="关闭">&times;</button>
      <h3>扫码加入交流群</h3>
      <img src="assets/community-qr.jpg" alt="交流群二维码">
      <p>QQ 扫一扫，加入拓墨交流群<br>分享写作技巧与使用反馈</p>
    </div>
  </div>
  <script>
    (function () {
      var fab = document.getElementById('qr-fab');
      var overlay = document.getElementById('qr-overlay');
      var close = document.getElementById('qr-close');
      function openQr() { overlay.classList.add('open'); }
      function closeQr() { overlay.classList.remove('open'); }
      fab.addEventListener('click', openQr);
      close.addEventListener('click', closeQr);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeQr();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeQr();
      });
    })();
  </script>
</body>
</html>
